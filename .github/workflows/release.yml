name: Release
on:
  push:
    tags: ['v*']
# Least privilege: read-only by default, write access only for the job that publishes the GitHub release.
# Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      # No dependency cache in the release workflow: a release is built from a clean install only.
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/phpunit
  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must equal Version::VERSION and whmcs.json version
        run: |
          v="$(sed -n "s/.*public const VERSION = '\([^']*\)'.*/\1/p" lib/Version.php)"
          [ -n "$v" ] || { echo "Version::VERSION not found"; exit 1; }
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
          w="$(jq -r .version whmcs.json)"
          [ "$w" = "$v" ] || { echo "whmcs.json version $w != $v"; exit 1; }
      - run: sh bin/build.sh
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
