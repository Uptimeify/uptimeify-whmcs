# WHMCS sandbox for the Uptimeify addon. Usage and prerequisites: docker/sandbox/README.md.
# Needs the unpacked WHMCS release in docker/whmcs/ (gitignored) and a WHMCS development licence.
# Never points at Uptimeify production: the module's API base URL is set to http://host.docker.internal:3001.
name: uptimeify-whmcs-sandbox

services:
  db:
    image: mariadb:10.11.19
    # WHMCS does not support strict mode and recommends utf8_unicode_ci (docs.whmcs.com, System Requirements).
    command: ["--sql-mode=NO_ENGINE_SUBSTITUTION", "--character-set-server=utf8", "--collation-server=utf8_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: whmcs
      MARIADB_USER: whmcs
      MARIADB_PASSWORD: whmcs
    volumes: ["./data/db:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 5s, retries: 20 }
    networks: [sandbox]

  php:
    build: { context: ., dockerfile: whmcs.Dockerfile }
    volumes:
      - ./whmcs:/var/www/html            # unpacked WHMCS release (gitignored)
      - ..:/var/www/html/modules/addons/uptimeify:ro
    environment:
      WHMCS_DB_HOST: db
    env_file:
      - path: ../.env.sandbox            # gitignored, template: .env.sandbox.example
        required: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: { db: { condition: service_healthy } }
    networks:
      sandbox:
        ipv4_address: 172.30.88.10       # fixed, so the IP does not change on `down` (cron runs here; licence, README)

  web:
    image: nginx:1.30.4-alpine
    # Loopback only: a development licence requires the installation to be private.
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./whmcs:/var/www/html:ro
      - ..:/var/www/html/modules/addons/uptimeify:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]                  # php creates modules/addons/uptimeify in docker/whmcs; this mount is read only
    networks:
      sandbox:
        ipv4_address: 172.30.88.11       # fixed: WHMCS sees this address as SERVER_ADDR on web requests

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["127.0.0.1:8025:8025"]     # web UI; WHMCS sends SMTP to mailpit:1025 inside the network
    networks: [sandbox]

networks:
  sandbox:
    ipam:
      config:
        - subnet: 172.30.88.0/24
