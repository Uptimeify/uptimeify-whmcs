# WHMCS sandbox site. PHP runs in the "php" service (PHP-FPM on :9000); both containers mount WHMCS at /var/www/html.
# WHMCS protects some directories with .htaccess, which nginx ignores, so they are denied here
# (https://docs.whmcs.com/9-0/installation-guide/initial-configuration/restrict-nginx-directory-access/).
server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    client_max_body_size 32m;

    location ^~ /vendor/       { deny all; return 403; }
    location ^~ /templates_c/  { deny all; return 403; }
    location ^~ /attachments/  { deny all; return 403; }
    location ^~ /downloads/    { deny all; return 403; }
    location ^~ /crons/        { deny all; return 403; }

    # The module bind mount is the whole repository (incl. docker/, tests/, vendor/, a local .env.sandbox).
    # WHMCS includes the module files from PHP; the browser only needs the logo.
    location ^~ /modules/addons/uptimeify/ {
        location = /modules/addons/uptimeify/logo.png { allow all; }
        deny all;
        return 403;
    }

    # Dotfiles (.env*, .git, .htaccess) are never served.
    location ~ /\. { deny all; return 403; }

    # Front controller: routable paths (friendly URLs, /admin/...) fall through to index.php.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }
}
